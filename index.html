<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin_Server_VLČR :: Členský portál</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- FALEŠNÉ PŘIHLAŠOVACÍ OKNO (NENÁPADNÁ KAMUFLÁŽ) -->
    <div id="login-container">
        <div class="window login-window">
            <div class="window-header">
                <span class="icon">🔒</span>
                <span class="title">Admin_Server_VLČR :: Členský portál</span>
                <div class="window-controls">
                    <button class="control-btn">_</button>
                    <button class="control-btn">X</button>
                </div>
            </div>
            <div class="window-body">
                <div class="login-logo-section">
                    <div class="logo-text">VZDĚLANÝ LID ČR</div>
                    <div class="logo-sub">INTERNÍ ČLENSKÝ PORTÁL & EVIDENCE</div>
                </div>
                <hr class="office-hr">
                
                <form id="login-form">
                    <p class="login-instruction">
                        <strong>Systémové upozornění:</strong> Toto je vstup do zašifrovaného přihlašovacího portálu - z důvodu bezpečnosti jsme změnili systém.
                    </p>
                    
                    <div class="form-actions text-center">
                        <button type="submit" class="office-btn btn-primary" id="start-btn">Vstoupit</button>
                    </div>
                </form>
            </div>
            <div class="window-footer">
                <span>Status: IIS/6.0 Secured</span>
                <span>SSL-Sifrovani: Vypnuto (Interní)</span>
            </div>
        </div>
    </div>

    <!-- BRAIN ROT CHAOS PLÁTNO (SPUSTÍ SE PO KLIKNUTÍ NA VSTOUPIT) -->
    <div id="slide-container" class="hidden"></div>
    
    <!-- PULZUJÍCÍ TEXT -->
    <h1 id="pulsing-text" class="hidden">Tomáš Pospíšil<br>je blbý</h1>

    <!-- AUDIOPLAYER -->
    <audio id="bg-music" src="robots.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
